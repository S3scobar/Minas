<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 300" width="300" height="300">
  <defs>
    <radialGradient id="bgGradSme" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </radialGradient>
    <linearGradient id="goldGradSme" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFC107"/>
      <stop offset="100%" stop-color="#FFA000"/>
    </linearGradient>
  </defs>
  <rect width="300" height="300" rx="40" fill="url(#bgGradSme)"/>
  <circle cx="150" cy="150" r="130" fill="none" stroke="url(#goldGradSme)" stroke-width="4" stroke-dasharray="8 4"/>
  <circle cx="150" cy="150" r="118" fill="#181818" stroke="#333" stroke-width="2"/>
  
  <!-- Crossed Mining Pick and Hammer -->
  <g transform="translate(150, 115) scale(0.95)">
    <!-- Pick -->
    <path d="M-45 -35 C-20 -48 20 -48 45 -35 C38 -25 30 -22 25 -25 C10 -35 -10 -35 -25 -25 C-30 -22 -38 -25 -45 -35 Z" fill="url(#goldGradSme)"/>
    <rect x="-4" y="-30" width="8" height="68" rx="3" transform="rotate(35 0 4)" fill="#E0E0E0"/>
    <!-- Hammer -->
    <rect x="-16" y="-38" width="32" height="18" rx="2" transform="rotate(-35 0 -29)" fill="url(#goldGradSme)"/>
    <rect x="-4" y="-30" width="8" height="68" rx="3" transform="rotate(-35 0 4)" fill="#E0E0E0"/>
    <!-- Core Molten Pot -->
    <circle cx="0" cy="22" r="14" fill="#FFA000" opacity="0.3"/>
    <circle cx="0" cy="22" r="8" fill="#FFC107"/>
  </g>

  <!-- SME Text -->
  <text x="150" y="200" font-family="'Space Grotesk', 'Outfit', sans-serif" font-weight="900" font-size="38" fill="url(#goldGradSme)" text-anchor="middle" letter-spacing="4">SME</text>
  <text x="150" y="222" font-family="'Plus Jakarta Sans', sans-serif" font-weight="700" font-size="10" fill="#BDBDBD" text-anchor="middle" letter-spacing="2">STUDENT CHAPTER</text>
  <text x="150" y="238" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="9" fill="#FFECB3" text-anchor="middle" letter-spacing="1.5">UNAL MEDELLÍN</text>
</svg>
